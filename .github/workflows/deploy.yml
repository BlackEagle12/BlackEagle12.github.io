name: Deploy React Portfolio to GitHub Pages

on:
    push:
        branches: ["main"] # Change to 'master' if your default branch is master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build-and-deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20" # You can change this to match your local Node version

            - name: Install Dependencies
              run: npm ci # Or use 'npm install' or 'yarn install' depending on your package manager

            - name: Build Project
              run: npm run build # Or 'yarn build'

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  # IMPORTANT: Check your build folder name!
                  # Use './build' if you used Create React App.
                  # Use './dist' if you used Vite.
                  path: "./dist"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
